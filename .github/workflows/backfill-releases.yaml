name: Backfill Releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backfill-releases.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-releases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: v0.5.5
            previous: v0.5.4
          - version: v0.5.6
            previous: v0.5.5
          - version: v0.5.7
            previous: v0.5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare release notes
        run: |
          notes_file="dist/${{ matrix.version }}-release-notes.md"
          ./scripts/changelog-release-notes \
            "${{ matrix.version }}" README.md "${notes_file}"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "${GITHUB_REPOSITORY}" \
            "${{ matrix.previous }}" \
            "${{ matrix.version }}" >> "${notes_file}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.version }}
          body_path: dist/${{ matrix.version }}-release-notes.md
          draft: false
          prerelease: false
          make_latest: false
