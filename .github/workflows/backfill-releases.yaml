name: Backfill Releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backfill-releases.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill-releases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: v0.5.5
            previous: v0.5.4
          - version: v0.5.6
            previous: v0.5.5
          - version: v0.5.7
            previous: v0.5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare release notes
        run: |
          notes_file="dist/${{ matrix.version }}-release-notes.md"
          ./scripts/changelog-release-notes \
            "${{ matrix.version }}" README.md "${notes_file}"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "${GITHUB_REPOSITORY}" \
            "${{ matrix.previous }}" \
            "${{ matrix.version }}" >> "${notes_file}"
      - name: Update and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES_FILE: dist/${{ matrix.version }}-release-notes.md
          RELEASE_VERSION: ${{ matrix.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.RELEASE_NOTES_FILE, 'utf8');
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: process.env.RELEASE_VERSION,
            });
            const { data: updated } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'false',
            });
            if (updated.draft || updated.body !== body) {
              core.setFailed(`release verification failed for ${process.env.RELEASE_VERSION}`);
            }
