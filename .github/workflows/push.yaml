name: Push to Master

on:
  push:
    branches:
      - release/v*
      - main
      - "release/v*"
    tags:
      - "v*.*.*" # Matches any tag that starts with 'v' and follows semantic versioning

env:
  ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${{ github.ref_name }}"
          COMMIT="${GITHUB_SHA}"
          LDFLAGS="-s -w -buildid= -X github.com/cnrancher/kube-explorer/internal/version.Version=${VERSION} -X github.com/cnrancher/kube-explorer/internal/version.GitCommit=${COMMIT}"

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -p 1 -tags embed -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/kube-explorer-linux-${arch}" .
          done

          git diff --exit-code
      - name: Prepare for packaging image
        run: cp dist/* package/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # aliyun image to test the docker build is ok
      - name: Login to Aliyun ACR
        if: ${{ vars.ALIYUN_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_TOKEN }}
      - name: Aliyun image docker meta
        if: ${{ vars.ALIYUN_REGISTRY != '' }}
        id: aliyun-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/zhangsean/kube-explorer
          tags: |
            type=ref,event=tag
            type=ref,event=branch,suffix=-head
      - name: Build to Aliyun
        if: ${{ vars.ALIYUN_REGISTRY != '' }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          labels: ${{ steps.aliyun-meta.outputs.labels }}
          tags: "${{ steps.aliyun-meta.outputs.tags }}"
          context: package
          push: true

      # docker hub multi-arch image
      - name: Login to Dockerhub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zhangsean/kube-explorer
          tags: |
            type=ref,event=tag
      - name: Build to Dockerhub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          labels: ${{ steps.meta.outputs.labels }}
          tags: "${{ steps.meta.outputs.tags }}"
          context: package
          push: true

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/kube-explorer-*
          generate_release_notes: true
          draft: true
